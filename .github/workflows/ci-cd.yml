name: CI Pipeline.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DemoApi_K8S/DemoApi_K8S.csproj

      - name: Build application
        run: dotnet build DemoApi_K8S/DemoApi_K8S.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release

      - name: Build Docker image
        run: docker build -t demo-api:latest ./DemoApi_K8S
