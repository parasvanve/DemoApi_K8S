name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI JOB
  # =========================
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DemoApi_K8S/DemoApi_K8S.csproj

      - name: Build application
        run: dotnet build DemoApi_K8S/DemoApi_K8S.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release

      # Docker Hub login
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build image
      - name: Build Docker image
        run: docker build -t demo-api:latest ./DemoApi_K8S

      # Tag image
      - name: Tag Docker image
        run: docker tag demo-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/demo-api:latest

      # Push image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/demo-api:latest


  # =========================
  # CD JOB
  # =========================
  deploy-to-minikube:

    runs-on: self-hosted

    needs: build-and-test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Minikube
        run: kubectl apply -f K8S/deployment.yaml

      - name: Apply Service
        run: kubectl apply -f K8S/service.yaml
